spring:
  application:
    name: call-routing-service

  datasource:
    url: jdbc:h2:mem:calldb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create

  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka