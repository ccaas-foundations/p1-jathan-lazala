spring:
  application:
    name: call-routing-service

  datasource:
    url: jdbc:h2:mem:calldb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

server:
  port: 8082

app:
  queue-name: call.routing.queue

agent-service:
  base-url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
